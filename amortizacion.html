<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Préstamos - Proporcional</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
    --accent:#00d9a3;--accent2:#0ea5e9;--danger:#f85149;--warning:#e3b341;
    --text:#e6edf3;--text2:#8b949e;--text3:#484f58;
    --paid:#1a3a2a;--paid-border:#238636;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;}
  .header-logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:16px;color:#000;}
  .header h1{font-size:18px;font-weight:600;}

  .container{max-width:1400px;margin:0 auto;padding:32px;display:grid;grid-template-columns:360px 1fr;gap:24px;align-items:start;}

  .config-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .panel-header{padding:16px 20px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;text-transform:uppercase;color:var(--text2);display:flex;align-items:center;gap:8px;}
  .panel-header::before{content:'';width:8px;height:8px;background:var(--accent);border-radius:50%;}

  .form-body{padding:20px;display:flex;flex-direction:column;gap:16px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;}
  .field input, .field select{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:14px;padding:10px;outline:none;}
  .field input:focus{border-color:var(--accent);}

  .btn-calcular{margin:0 20px 20px;padding:14px;background:var(--accent);color:#000;border:none;border-radius:8px;font-weight:700;cursor:pointer;transition:0.2s;}
  .btn-calcular:hover{filter:brightness(1.1);transform:translateY(-1px);}

  .table-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
  .table-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;}
  th{padding:12px 16px;text-align:right;font-size:11px;color:var(--text3);text-transform:uppercase;border-bottom:2px solid var(--border);}
  th:first-child, td:first-child{text-align:left;}
  td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--border);text-align:right;}
  .num{font-family:'IBM Plex Mono',monospace;}

  .proporcional-badge {
    background: rgba(14, 165, 233, 0.15);
    color: var(--accent2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    margin-left: 5px;
  }

  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 20px 20px;}
  .stat-card{background:var(--surface2);padding:12px;border-radius:8px;border:1px solid var(--border);}
  .stat-label{font-size:10px;color:var(--text2);text-transform:uppercase;}
  .stat-value{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;}

  @media(max-width:900px){ .container{grid-template-columns:1fr;} }
</style>
</head>
<body>

<div class="header">
  <div class="header-logo">LP</div>
  <h1>Simulador de Préstamos Proporcional</h1>
</div>

<div class="container">
  <div class="config-panel">
    <div class="panel-header">Configuración</div>
    <div class="form-body">
      <div class="field">
        <label>Monto del Préstamo (L)</label>
        <input type="number" id="capital" value="50000">
      </div>
      <div class="field">
        <label>Tasa Mensual (%)</label>
        <input type="number" id="tasa" value="5" step="0.1">
      </div>
      <div class="field">
        <label>Frecuencia de Pago</label>
        <select id="frecuencia" onchange="toggleParametros()">
          <option value="mensual">Mensual</option>
          <option value="quincenal">Quincenal</option>
          <option value="semanal">Semanal</option>
        </select>
      </div>

      <div id="paramsMensual" class="field">
        <label>Día de pago del mes</label>
        <input type="number" id="diaPagoMes" value="25" min="1" max="31">
      </div>

      <div id="paramsQuincenal" class="field" style="display:none;">
        <label>Días de pago (ej: 15 y 30)</label>
        <div style="display:flex; gap:5px;">
          <input type="number" id="q1" value="15" min="1" max="31" style="width:50%">
          <input type="number" id="q2" value="30" min="1" max="31" style="width:50%">
        </div>
      </div>

      <div id="paramsSemanal" class="field" style="display:none;">
        <label>Día de la semana</label>
        <select id="diaSemana">
          <option value="1">Lunes</option>
          <option value="2">Martes</option>
          <option value="3">Miércoles</option>
          <option value="4">Jueves</option>
          <option value="5">Viernes</option>
          <option value="6">Sábado</option>
          <option value="0">Domingo</option>
        </select>
      </div>

      <div class="field">
        <label>Plazo (Número de cuotas)</label>
        <input type="number" id="plazo" value="12">
      </div>
      <div class="field">
        <label>Fecha de Solicitud</label>
        <input type="date" id="fechaSolicitud">
      </div>
    </div>

    <div class="stats-grid" id="statsGrid" style="display:none">
      <div class="stat-card"><div class="stat-label">Cuota Base</div><div class="stat-value" id="statCuota"></div></div>
      <div class="stat-card"><div class="stat-label">Total Interés</div><div class="stat-value" id="statInteres"></div></div>
    </div>

    <button class="btn-calcular" onclick="calcular()">⚡ Calcular Tabla</button>
  </div>

  <div class="table-panel">
    <div class="table-header">
      <div style="font-size:13px; font-weight:600; color:var(--text2)">TABLA DE AMORTIZACIÓN</div>
    </div>
    <div class="table-wrap" id="tableWrap">
      <div style="padding:40px; text-align:center; color:var(--text3)">Ingresa los datos para generar la tabla</div>
    </div>
  </div>
</div>

<script>
  // Inicializar fecha de hoy
  document.getElementById('fechaSolicitud').value = new Date().toISOString().split('T')[0];

  function toggleParametros() {
    const f = document.getElementById('frecuencia').value;
    document.getElementById('paramsMensual').style.display = f === 'mensual' ? 'block' : 'none';
    document.getElementById('paramsQuincenal').style.display = f === 'quincenal' ? 'block' : 'none';
    document.getElementById('paramsSemanal').style.display = f === 'semanal' ? 'block' : 'none';
  }

  function fmt(n) { return n.toLocaleString('es-HN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

  function obtenerSiguienteFecha(fechaActual, frecuencia) {
    let f = new Date(fechaActual);
    if (frecuencia === 'mensual') {
      const diaObjetivo = parseInt(document.getElementById('diaPagoMes').value);
      f.setMonth(f.getMonth() + 1);
      f.setDate(diaObjetivo);
    } else if (frecuencia === 'quincenal') {
      const q1 = parseInt(document.getElementById('q1').value);
      const q2 = parseInt(document.getElementById('q2').value);
      // Lógica simplificada: si está en q1, pasar a q2, si está en q2, pasar a q1 del mes siguiente
      if (f.getDate() <= q1) {
        f.setDate(q2);
      } else {
        f.setMonth(f.getMonth() + 1);
        f.setDate(q1);
      }
    } else {
      f.setDate(f.getDate() + 7);
    }
    return f;
  }

  function buscarPrimerPago(fechaSol, frecuencia) {
    let f = new Date(fechaSol);
    f.setDate(f.getDate() + 1); // El pago no puede ser el mismo día

    if (frecuencia === 'mensual') {
      const dia = parseInt(document.getElementById('diaPagoMes').value);
      if (f.getDate() > dia) f.setMonth(f.getMonth() + 1);
      f.setDate(dia);
    } else if (frecuencia === 'quincenal') {
      const q1 = parseInt(document.getElementById('q1').value);
      const q2 = parseInt(document.getElementById('q2').value);
      if (f.getDate() <= q1) f.setDate(q1);
      else if (f.getDate() <= q2) f.setDate(q2);
      else { f.setMonth(f.getMonth() + 1); f.setDate(q1); }
    } else {
      const diaS = parseInt(document.getElementById('diaSemana').value);
      while(f.getDay() !== diaS) { f.setDate(f.getDate() + 1); }
    }
    return f;
  }

  function calcular() {
    const capitalInicial = parseFloat(document.getElementById('capital').value);
    const tasaMensual = parseFloat(document.getElementById('tasa').value) / 100;
    const plazo = parseInt(document.getElementById('plazo').value);
    const frecuencia = document.getElementById('frecuencia').value;
    const fechaSol = new Date(document.getElementById('fechaSolicitud').value + 'T00:00:00');

    // Días estándar por periodo para la prorrata
    const diasPeriodo = frecuencia === 'mensual' ? 30 : frecuencia === 'quincenal' ? 15 : 7;
    const tasaPeriodo = frecuencia === 'mensual' ? tasaMensual : frecuencia === 'quincenal' ? tasaMensual/2 : tasaMensual/4.33;

    // Cálculo de cuota fija (Nivelada)
    const cuotaBase = capitalInicial * (tasaPeriodo / (1 - Math.pow(1 + tasaPeriodo, -plazo)));
    
    let saldo = capitalInicial;
    let totalInteres = 0;
    let fechaPago = buscarPrimerPago(fechaSol, frecuencia);
    
    let html = `<table><thead><tr><th>#</th><th>Fecha</th><th>Capital</th><th>Interés</th><th>Cuota</th><th>Saldo</th></tr></thead><tbody>`;

    for (let i = 1; i <= plazo; i++) {
      let diasTranscurridos;
      let factorProrrata = 1;
      let notaProrrata = "";

      if (i === 1) {
        // Cálculo proporcional para la primera cuota
        const diffTime = Math.abs(fechaPago - fechaSol);
        diasTranscurridos = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        factorProrrata = diasTranscurridos / diasPeriodo;
        if (factorProrrata < 1) notaProrrata = `<span class="proporcional-badge">Prop. ${diasTranscurridos}d</span>`;
      }

      let interes = saldo * tasaPeriodo * factorProrrata;
      let capital = cuotaBase - (saldo * tasaPeriodo); // El capital se mantiene para amortizar en el plazo
      
      // En la última cuota ajustamos para que el saldo sea 0
      if (i === plazo) capital = saldo;

      let cuotaEfectiva = capital + interes;
      saldo -= capital;
      totalInteres += interes;

      html += `<tr>
        <td>${i}</td>
        <td class="fecha-cell">${fechaPago.toLocaleDateString('es-HN')}${notaProrrata}</td>
        <td class="num">${fmt(capital)}</td>
        <td class="num">${fmt(interes)}</td>
        <td class="num" style="font-weight:700">${fmt(cuotaEfectiva)}</td>
        <td class="num">${fmt(Math.max(0, saldo))}</td>
      </tr>`;

      fechaPago = obtenerSiguienteFecha(fechaPago, frecuencia);
    }

    html += `</tbody></table>`;
    document.getElementById('tableWrap').innerHTML = html;
    document.getElementById('statCuota').textContent = 'L ' + fmt(cuotaBase);
    document.getElementById('statInteres').textContent = 'L ' + fmt(totalInteres);
    document.getElementById('statsGrid').style.display = 'grid';
  }
</script>
</body>
</html>
