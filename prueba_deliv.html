<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LendFlow | Finanzas de Élite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: #ffffff;
            -webkit-tap-highlight-color: transparent;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .bento-card {
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .bento-card:active {
            transform: scale(0.97);
            background: rgba(255, 255, 255, 0.08);
        }

        .neon-border-blue { border-left: 4px solid #3b82f6; }
        .neon-border-purple { border-left: 4px solid #a855f7; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }

        @keyframes drift {
            0% { transform: translate(0, 0); }
            50% { transform: translate(10px, 10px); }
            100% { transform: translate(0, 0); }
        }
        .bg-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.1) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            animation: drift 10s infinite alternate;
        }
    </style>
</head>
<body class="pb-28">

    <div class="bg-glow top-0 -left-20"></div>
    <div class="bg-glow bottom-0 -right-20" style="animation-delay: -5s; background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, rgba(0,0,0,0) 70%);"></div>

    <header class="p-6 flex justify-between items-center max-w-lg mx-auto">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/20">
                <i data-lucide="shield-check" class="w-6 h-6 text-white"></i>
            </div>
            <div>
                <h1 class="text-xs text-zinc-500 font-bold uppercase tracking-widest">Global Vault</h1>
                <p class="text-lg font-bold">Nexus Capital</p>
            </div>
        </div>
        <button class="w-12 h-12 rounded-2xl glass-panel flex items-center justify-center relative">
            <i data-lucide="bell" class="w-5 h-5 text-zinc-300"></i>
            <span class="absolute top-3 right-3 w-2 h-2 bg-rose-500 rounded-full border-2 border-black"></span>
        </button>
    </header>

    <main class="px-6 max-w-lg mx-auto">
        
        <div class="grid grid-cols-6 gap-3 mb-8">
            
            <div class="col-span-6 glass-panel rounded-[32px] p-6 bento-card overflow-hidden relative">
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-zinc-400 text-sm font-medium">Cartera bajo gestión</span>
                        <span class="bg-blue-500/10 text-blue-400 text-[10px] font-bold px-2 py-1 rounded-full border border-blue-500/20 uppercase">Pro Trader</span>
                    </div>
                    <h2 class="text-4xl font-extrabold tracking-tighter mb-1">$842,500<span class="text-zinc-600">.00</span></h2>
                    <p class="text-emerald-400 text-xs font-bold flex items-center gap-1">
                        <i data-lucide="trending-up" class="w-3 h-3"></i> +$12,402 hoy
                    </p>
                </div>
                <div class="absolute -right-10 -bottom-10 opacity-10">
                    <i data-lucide="activity" class="w-40 h-40"></i>
                </div>
            </div>

            <div class="col-span-3 glass-panel rounded-[32px] p-5 bento-card flex flex-col justify-between bg-blue-600/10 border-blue-500/20">
                <div class="bg-blue-500 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/40">
                    <i data-lucide="plus" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm">Nuevo Préstamo</h3>
                    <p class="text-[10px] text-zinc-400">Desembolso inmediato</p>
                </div>
            </div>

            <div class="col-span-3 glass-panel rounded-[32px] p-5 bento-card flex flex-col justify-between bg-purple-600/10 border-purple-500/20">
                <div class="bg-purple-500 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg shadow-purple-600/40">
                    <i data-lucide="layers" class="text-white w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="font-bold text-sm">Ruta de Cobro</h3>
                    <p class="text-[10px] text-zinc-400">12 clientes pendientes</p>
                </div>
            </div>

            <div class="col-span-2 glass-panel rounded-[24px] p-4 bento-card text-center">
                <p class="text-[10px] text-zinc-500 font-bold uppercase mb-1">Risk</p>
                <p class="text-lg font-bold text-orange-400">A+</p>
            </div>

            <div class="col-span-4 glass-panel rounded-[24px] p-4 bento-card flex items-center justify-between">
                <div>
                    <p class="text-[10px] text-zinc-500 font-bold uppercase">ROI Anual</p>
                    <p class="text-lg font-bold">24.8%</p>
                </div>
                <div class="flex gap-1">
                    <div class="w-1 h-4 bg-zinc-800 rounded-full"></div>
                    <div class="w-1 h-6 bg-blue-500 rounded-full"></div>
                    <div class="w-1 h-3 bg-zinc-800 rounded-full"></div>
                </div>
            </div>
        </div>

        <section class="mb-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg tracking-tight">Cobros Prioritarios</h3>
                <i data-lucide="more-horizontal" class="text-zinc-500"></i>
            </div>

            <div class="space-y-3">
                <div class="glass-panel p-4 rounded-[24px] flex items-center justify-between bento-card neon-border-blue">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center font-bold text-sm">
                            JD
                        </div>
                        <div>
                            <p class="font-bold text-sm">Juan Delgado</p>
                            <p class="text-xs text-zinc-500 italic">Vence hoy</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-sm text-blue-400">$150.00</p>
                        <button class="text-[10px] font-bold text-zinc-500 uppercase tracking-tighter">Recordar</button>
                    </div>
                </div>

                <div class="glass-panel p-4 rounded-[24px] flex items-center justify-between bento-card neon-border-purple">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center font-bold text-sm">
                            AM
                        </div>
                        <div>
                            <p class="font-bold text-sm">Ana Martínez</p>
                            <p class="text-xs text-rose-500 italic">Atraso 2 días</p>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="font-bold text-sm text-purple-400">$420.00</p>
                        <button class="text-[10px] font-bold text-zinc-500 uppercase tracking-tighter">WhatsApp</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <nav class="fixed bottom-8 left-6 right-6 z-50">
        <div class="max-w-md mx-auto glass-panel rounded-full px-8 py-4 flex justify-between items-center shadow-2xl">
            <button class="text-blue-500"><i data-lucide="layout-grid" class="w-6 h-6"></i></button>
            <button class="text-zinc-600"><i data-lucide="users" class="w-6 h-6"></i></button>
            <button class="text-zinc-600"><i data-lucide="wallet" class="w-6 h-6"></i></button>
            <button class="text-zinc-600"><i data-lucide="settings" class="w-6 h-6"></i></button>
            <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-zinc-800">
                <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?auto=format&fit=crop&w=100&q=80" alt="Admin">
            </div>
        </div>
    </nav>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
