<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Carnet de Gimnasio Pro</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box; /* Importante para el padding */
        }

        .custom-file-upload {
            border: 1px solid #ccc;
            display: inline-block;
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 6px;
            background-color: #fff;
            color: #333;
            width: 100%;
            box-sizing: border-box;
            margin-top: 5px;
        }
        .custom-file-upload:hover {
            background-color: #eee;
        }
        
        #file-chosen {
            margin-left: 10px;
            color: #777;
            font-size: 0.9em;
        }

        button.generate-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
            margin-top: 15px;
            transition: background-color 0.2s;
        }

        button.generate-btn:hover {
            background-color: #0056b3;
        }

        /* --- Estilos del Carnet --- */
        #carnet-result {
            margin-top: 30px;
            display: none; /* Oculto hasta que se genere */
        }

        #carnet-canvas {
            width: 320px;
            height: 190px;
            background-color: #222; /* Fondo oscuro */
            color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            border: 2px solid #ffcc00; /* Borde amarillo/oro */
            margin: 0 auto;
        }

        /* Encabezado */
        .card-header {
            position: absolute;
            top: 10px;
            left: 15px;
            font-size: 0.8em;
            font-weight: bold;
            color: #ffcc00; /* Color amarillo */
            letter-spacing: 1px;
        }

        /* Contenedor Foto */
        .card-photo {
            width: 100px;
            height: 100px;
            border-radius: 5px;
            overflow: hidden;
            border: 2px solid #fff;
            margin-right: 15px;
        }

        .card-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Recorta para llenar */
        }

        /* Contenedor Datos */
        .card-details {
            flex-grow: 1;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card-label {
            font-size: 0.65em;
            color: #ccc;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .card-value-name {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        
        .card-value-id {
            font-size: 0.85em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #eee;
        }

        .card-sub-details {
             font-size: 0.7em;
             color: #bbb;
        }

        .print-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        .print-btn:hover {
            background-color: #1e7e34;
        }

        @media print {
            body * {
                visibility: hidden;
            }
            #carnet-canvas, #carnet-canvas * {
                visibility: visible;
            }
            #carnet-canvas {
                position: absolute;
                left: 0;
                top: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Generador de Carnet</h2>

    <div class="input-group">
        <label>Paso 1: Sube tu Foto</label>
        <label for="upload-photo" class="custom-file-upload">
             Seleccionar Foto
        </label>
        <input id="upload-photo" type="file" accept="image/jpeg, image/png" style="display:none;" />
        <span id="file-chosen">No hay foto</span>
    </div>

    <div class="input-group">
        <label for="user-name">Paso 2: Escribe tu Nombre Completo</label>
        <input type="text" id="user-name" placeholder="Ej. Juan Pérez">
    </div>

    <button class="generate-btn" onclick="generarCarnet()">Generar Carnet</button>

    <div id="carnet-result">
        <h3>Tu Carnet:</h3>
        
        <div id="carnet-canvas">
            <div class="card-header">MEMBRESÍA DE GIMNASIO</div>
            <div class="card-photo">
                <img id="card-image-placeholder" src="" alt="Tu Foto">
            </div>
            <div class="card-details">
                <div class="card-label">Socio:</div>
                <div class="card-value-name" id="card-name-placeholder">NOMBRE SOCIO</div>
                
                <div class="card-label">ID Socio:</div>
                <div class="card-value-id" id="card-id-placeholder">#######</div>

                <div class="card-sub-details">Vence: 12/2024 | Tipo: Premium</div>
            </div>
        </div>
        
        <button class="print-btn" onclick="window.print()">Imprimir Carnet</button>
    </div>

</div>

<script>
    const fileInput = document.getElementById('upload-photo');
    const nameInput = document.getElementById('user-name');
    const fileChosenText = document.getElementById('file-chosen');

    const carnetResult = document.getElementById('carnet-result');
    const cardImage = document.getElementById('card-image-placeholder');
    const cardName = document.getElementById('card-name-placeholder');
    const cardId = document.getElementById('card-id-placeholder');

    // Mostrar el nombre del archivo seleccionado
    fileInput.addEventListener('change', function() {
        if (this.files && this.files[0]) {
            fileChosenText.textContent = this.files[0].name;
        } else {
            fileChosenText.textContent = "No hay foto";
        }
    });

    function generarCarnet() {
        // 1. Validar que el usuario subió una foto
        if (!fileInput.files || !fileInput.files[0]) {
            alert("Por favor, sube una foto primero.");
            return;
        }

        // 2. Validar que el usuario puso un nombre
        const nombre = nameInput.value.trim();
        if (nombre === "") {
            alert("Por favor, escribe un nombre.");
            nameInput.focus();
            return;
        }

        // 3. Procesar la Imagen (convertirla a formato base64 para mostrarla)
        const reader = new FileReader();
        reader.onload = function(e) {
            cardImage.src = e.target.result; // Asignar la imagen cargada al carnet

            // 4. Actualizar el nombre en el carnet
            cardName.textContent = nombre;

            // 5. Generar un ID de socio aleatorio (para el ejemplo)
            cardId.textContent = 'A' + Math.floor(100000000 + Math.random() * 900000000);

            // 6. Mostrar el carnet
            carnetResult.style.display = 'block';
        }
        reader.readAsDataURL(fileInput.files[0]);
    }
</script>

</body>
</html>
