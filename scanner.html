<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Pro - Conteo de Inventario</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
      --accent:#00d9a3;--accent2:#0ea5e9;--danger:#f85149;
      --text:#e6edf3;--text2:#8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: var(--bg); color: var(--text); 
      font-family: 'DM Sans', sans-serif; min-height: 100vh; 
      padding-bottom: 50px;
    }

    .header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 16px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
    }
    .logo {
      width: 32px; height: 32px; background: var(--accent);
      border-radius: 6px; display: flex; align-items: center;
      justify-content: center; color: #000; font-weight: bold;
    }

    .container { max-width: 600px; margin: 20px auto; padding: 0 16px; }

    /* Estilos del Scanner */
    #reader {
      background: var(--surface); border: 1px solid var(--border) !important;
      border-radius: 12px; overflow: hidden;
    }
    #reader__dashboard_section_csr button {
      background: var(--accent) !important; color: #000 !important;
      border: none !important; padding: 8px 16px !important;
      border-radius: 6px !important; font-weight: 600 !important;
      cursor: pointer; margin: 10px 0 !important;
    }

    .stats-bar {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      padding: 16px; border-radius: 12px; text-align: center;
    }
    .stat-num { 
      display: block; font-size: 24px; font-weight: bold; 
      font-family: 'IBM Plex Mono', monospace; color: var(--accent);
    }
    .stat-label { font-size: 12px; color: var(--text2); text-transform: uppercase; }

    /* Tabla de Resultados */
    .results-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .panel-header {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .btn-action {
      background: transparent; border: 1px solid var(--border);
      color: var(--text2); padding: 6px 12px; border-radius: 6px;
      font-size: 12px; cursor: pointer; transition: 0.2s;
    }
    .btn-action:hover { border-color: var(--danger); color: var(--danger); }

    table { width: 100%; border-collapse: collapse; }
    th { 
      text-align: left; padding: 12px 16px; font-size: 11px; 
      color: var(--text2); text-transform: uppercase; border-bottom: 1px solid var(--border);
    }
    td { 
      padding: 12px 16px; font-size: 14px; border-bottom: 1px solid rgba(48,54,61,0.5);
      font-family: 'IBM Plex Mono', monospace;
    }
    .count-badge {
      background: var(--surface2); color: var(--accent);
      padding: 2px 8px; border-radius: 4px; font-weight: bold;
    }

    .last-scan {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #000; padding: 10px 20px;
      border-radius: 30px; font-weight: bold; box-shadow: 0 4px 20px rgba(0,217,163,0.4);
      display: none; z-index: 1000;
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">QR</div>
  <h1 style="font-size: 18px;">Scanner Pro</h1>
</div>

<div class="container">
  <div id="reader"></div>

  <div class="stats-bar">
    <div class="stat-card">
      <span class="stat-num" id="totalUnicos">0</span>
      <span class="stat-label">Únicos</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="totalEscaneos">0</span>
      <span class="stat-label">Total Escaneos</span>
    </div>
  </div>

  <div class="results-panel">
    <div class="panel-header">
      <span style="font-size: 13px; font-weight: 600;">LISTA DE CONTEO</span>
      <button class="btn-action" onclick="limpiar()">Limpiar Todo</button>
    </div>
    <div style="max-height: 400px; overflow-y: auto;">
      <table id="tablaResultados">
        <thead>
          <tr>
            <th>Código</th>
            <th style="text-align: right;">Cant.</th>
          </tr>
        </thead>
        <tbody id="listaCuerpo">
          </tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast" class="last-scan">¡Código detectado!</div>

<script>
  let inventario = {};
  let escaneosTotales = 0;

  // Configuración del Scanner
  const html5QrCode = new Html5Qrcode("reader");
  const config = { fps: 10, qrbox: { width: 250, height: 150 } };

  function onScanSuccess(decodedText, decodedResult) {
    // Evitar escaneos duplicados en milisegundos
    if (this.lastResult === decodedText) return;
    this.lastResult = decodedText;
    setTimeout(() => { this.lastResult = null; }, 1500);

    // Feedback visual y auditivo (vibración)
    if (navigator.vibrate) navigator.vibrate(100);
    mostrarToast(decodedText);

    // Lógica de conteo
    if (inventario[decodedText]) {
      inventario[decodedText]++;
    } else {
      inventario[decodedText] = 1;
    }
    
    escaneosTotales++;
    actualizarInterfaz();
  }

  function actualizarInterfaz() {
    const cuerpo = document.getElementById('listaCuerpo');
    const unicos = Object.keys(inventario).length;
    
    document.getElementById('totalUnicos').textContent = unicos;
    document.getElementById('totalEscaneos').textContent = escaneosTotales;

    cuerpo.innerHTML = "";
    // Mostrar los códigos (los más recientes arriba)
    Object.keys(inventario).reverse().forEach(codigo => {
      const row = `<tr>
        <td style="word-break: break-all;">${codigo}</td>
        <td style="text-align: right;"><span class="count-badge">${inventario[codigo]}</span></td>
      </tr>`;
      cuerpo.innerHTML += row;
    });
  }

  function mostrarToast(txt) {
    const toast = document.getElementById('toast');
    toast.textContent = "Detectado: " + (txt.length > 15 ? txt.substring(0,15) + "..." : txt);
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 2000);
  }

  function limpiar() {
    if (confirm("¿Vaciar todo el conteo actual?")) {
      inventario = {};
      escaneosTotales = 0;
      actualizarInterfaz();
    }
  }

  // Iniciar Cámara
  html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);

</script>
</body>
</html>
