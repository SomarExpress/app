<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Pro - Conteo de Inventario</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    :root {
      --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
      --accent:#00d9a3;--accent2:#0ea5e9;--danger:#f85149;
      --text:#e6edf3;--text2:#8b949e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      background: var(--bg); color: var(--text); 
      font-family: 'DM Sans', sans-serif; min-height: 100vh; 
      padding-bottom: 50px;
    }

    .header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 16px; display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
    }
    .logo {
      width: 32px; height: 32px; background: var(--accent);
      border-radius: 6px; display: flex; align-items: center;
      justify-content: center; color: #000; font-weight: bold;
    }

    .container { max-width: 600px; margin: 20px auto; padding: 0 16px; }

    /* Estilos del Area del Scanner */
    #reader {
      background: var(--surface); border: 1px solid var(--border) !important;
      border-radius: 12px; overflow: hidden;
      min-height: 250px; display: flex; align-items: center; justify-content: center;
    }
    
    /* Botón de activación manual */
    .btn-start-camera {
      background: var(--accent); color: #000; border: none; 
      padding: 15px 30px; border-radius: 8px; font-weight: 700; 
      cursor: pointer; transition: 0.2s; font-family: 'DM Sans', sans-serif;
    }
    .btn-start-camera:hover { transform: scale(1.05); }

    .stats-bar {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0;
    }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      padding: 16px; border-radius: 12px; text-align: center;
    }
    .stat-num { 
      display: block; font-size: 24px; font-weight: bold; 
      font-family: 'IBM Plex Mono', monospace; color: var(--accent);
    }
    .stat-label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }

    /* Tabla de Resultados */
    .results-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
    }
    .panel-header {
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(255,255,255,0.02);
    }
    .btn-clear {
      background: transparent; border: 1px solid var(--border);
      color: var(--text2); padding: 6px 12px; border-radius: 6px;
      font-size: 11px; cursor: pointer; font-weight: 600;
    }
    .btn-clear:hover { border-color: var(--danger); color: var(--danger); }

    table { width: 100%; border-collapse: collapse; }
    th { 
      text-align: left; padding: 12px 16px; font-size: 11px; 
      color: var(--text2); text-transform: uppercase; border-bottom: 1px solid var(--border);
    }
    td { 
      padding: 12px 16px; font-size: 14px; border-bottom: 1px solid rgba(48,54,61,0.5);
      font-family: 'IBM Plex Mono', monospace;
    }
    .count-badge {
      background: var(--surface2); color: var(--accent);
      padding: 2px 8px; border-radius: 4px; font-weight: bold; border: 1px solid var(--border);
    }

    /* Notificación flotante */
    .last-scan-toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: var(--accent); color: #000; padding: 12px 24px;
      border-radius: 30px; font-weight: bold; box-shadow: 0 8px 30px rgba(0,217,163,0.4);
      display: none; z-index: 1000; font-size: 14px;
    }

    video { border-radius: 8px; }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">QR</div>
  <h1 style="font-size: 18px; letter-spacing: -0.5px;">Scanner Pro</h1>
</div>

<div class="container">
  <div id="reader">
    <div id="cameraPrompt" style="text-align: center; padding: 40px;">
      <p style="color: var(--text2); margin-bottom: 20px; font-size: 14px;">La cámara requiere permiso para iniciar</p>
      <button class="btn-start-camera" onclick="iniciarCamara()">📷 ACTIVAR CÁMARA</button>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-card">
      <span class="stat-num" id="totalUnicos">0</span>
      <span class="stat-label">Códigos Únicos</span>
    </div>
    <div class="stat-card">
      <span class="stat-num" id="totalEscaneos">0</span>
      <span class="stat-label">Total Conteo</span>
    </div>
  </div>

  <div class="results-panel">
    <div class="panel-header">
      <span style="font-size: 12px; font-weight: 700; color: var(--text2); text-transform: uppercase;">Resultados del Escaneo</span>
      <button class="btn-clear" onclick="limpiar()">Limpiar Todo</button>
    </div>
    <div style="max-height: 450px; overflow-y: auto;">
      <table id="tablaResultados">
        <thead>
          <tr>
            <th>Código Detectado</th>
            <th style="text-align: right;">Cantidad</th>
          </tr>
        </thead>
        <tbody id="listaCuerpo">
          <tr>
            <td colspan="2" style="text-align: center; color: var(--text3); padding: 40px;">No hay datos escaneados</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div id="toast" class="last-scan-toast">¡Código detectado!</div>

<script>
  let inventario = {};
  let escaneosTotales = 0;
  const html5QrCode = new Html5Qrcode("reader");

  async function iniciarCamara() {
    const config = { 
      fps: 15, 
      qrbox: { width: 250, height: 180 },
      aspectRatio: 1.0 
    };

    try {
      // Ocultar el prompt de inicio
      document.getElementById('cameraPrompt').style.display = 'none';
      
      await html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess
      );
    } catch (err) {
      console.error("Error de cámara:", err);
      alert("Error: Asegúrate de dar permisos de cámara y que ningún otro app la esté usando.");
      document.getElementById('cameraPrompt').style.display = 'block';
    }
  }

  function onScanSuccess(decodedText, decodedResult) {
    // Evitar lecturas múltiples del mismo código en ráfaga (pausa de 1.5s)
    if (this.lastResult === decodedText) return;
    this.lastResult = decodedText;
    setTimeout(() => { this.lastResult = null; }, 1500);

    // Vibración (solo funciona en Android)
    if (navigator.vibrate) navigator.vibrate(80);
    
    mostrarToast(decodedText);

    // Lógica de conteo
    inventario[decodedText] = (inventario[decodedText] || 0) + 1;
    escaneosTotales++;
    
    actualizarInterfaz();
  }

  function actualizarInterfaz() {
    const cuerpo = document.getElementById('listaCuerpo');
    const keys = Object.keys(inventario);
    
    document.getElementById('totalUnicos').textContent = keys.length;
    document.getElementById('totalEscaneos').textContent = escaneosTotales;

    if (keys.length === 0) {
      cuerpo.innerHTML = `<tr><td colspan="2" style="text-align: center; color: var(--text3); padding: 40px;">No hay datos escaneados</td></tr>`;
      return;
    }

    cuerpo.innerHTML = "";
    // Mostrar los códigos, los últimos escaneados primero
    keys.reverse().forEach(codigo => {
      const row = `<tr>
        <td style="word-break: break-all; font-size: 13px;">${codigo}</td>
        <td style="text-align: right;"><span class="count-badge">${inventario[codigo]}</span></td>
      </tr>`;
      cuerpo.innerHTML += row;
    });
  }

  function mostrarToast(txt) {
    const toast = document.getElementById('toast');
    const corta = txt.length > 20 ? txt.substring(0,20) + "..." : txt;
    toast.textContent = "Leído: " + corta;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 2000);
  }

  function limpiar() {
    if (confirm("¿Seguro que quieres borrar todo el conteo actual?")) {
      inventario = {};
      escaneosTotales = 0;
      actualizarInterfaz();
    }
  }
</script>
</body>
</html>
